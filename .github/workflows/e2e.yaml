name: End-to-End test

# DISABLED ON A SCHEDULE — this lane cannot currently run. Do not re-enable the
# cron until the prerequisites below are met; until then it only queues nightly
# and is killed by the 24h queue timeout (15 consecutive cancelled runs as of
# 2026-08-03, zero successful runs ever).
#
# Two independent blockers:
#
#  1. Infrastructure. It needs a `arc-runner-set` self-hosted runner (none are
#     registered) and the secrets GARDENER_KUBECONFIG, AZURE_DNS_CLIENT_ID,
#     AZURE_DNS_CLIENT_SECRET, AZURE_DNS_SUBSCRIPTION_ID, AZURE_DNS_TENANT_ID
#     and HCLOUD_TOKEN (only RENOVATE_TOKEN is configured). The scripts also
#     assume a 23technologies-operated Gardener landscape (project
#     garden-23ke-ci, cloudprofile `regiocloud`) that this fork does not own.
#
#  2. Upstream. hack/ci/*.sh drives gardener's example/provider-extensions/
#     scaffolding and the make targets kind-extensions-up / gardener-extensions-up
#     / -down / kind-extensions-clean. Gardener removed all of them in PR #13994
#     ("Replace provider-extensions with remote setup", 2026-03-04), replacing
#     them with a gardener-operator based `remote` setup (make remote-up /
#     gardener-up, dev-setup/). Upstream states there is no direct migration
#     path, so these scripts need a rewrite, not a patch.
#
# Kept as workflow_dispatch so the work-in-progress stays runnable by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: arc-runner-set
    name: "End-to-End test"
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install Dependencies
        run: sudo apt-get update && sudo apt-get install -y apache2 git curl make jq openssh-client
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Setup Gardener kubeconfig
        env:
          GARDENER_KUBECONFIG: ${{ secrets.GARDENER_KUBECONFIG }}
        run: |
          mkdir -p hack/ci/secrets
          printf '%s' "$GARDENER_KUBECONFIG" > hack/ci/secrets/gardener-kubeconfig.yaml
      - name: Setup environment
        env:
          AZURE_DNS_CLIENT_ID: ${{ secrets.AZURE_DNS_CLIENT_ID }}
          AZURE_DNS_CLIENT_SECRET: ${{ secrets.AZURE_DNS_CLIENT_SECRET }}
          AZURE_DNS_SUBSCRIPTION_ID: ${{ secrets.AZURE_DNS_SUBSCRIPTION_ID }}
          AZURE_DNS_TENANT_ID: ${{ secrets.AZURE_DNS_TENANT_ID }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          bash hack/ci/00-environment.sh
      - name: Create shoot serving as seed
        run: |
          bash hack/ci/01-shoot-for-seed.sh
      - name: Prepare and start Gardener
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          CI: false
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: |
            bash hack/ci/02-prepare-gardener.sh
      - name: Create a test shoot
        run: |
          bash hack/ci/03-test-shoot.sh
      - name: Delete the test shoot
        if: ${{ always() }}
        run: |
          bash hack/ci/04-delete-test-shoot.sh
      - name: Tear down Gardener
        if: ${{ always() }}
        run: |
          bash hack/ci/05-tear-down-gardener.sh
      - name: Delete the shoot used as seed
        if: ${{ always() }}
        run: |
          bash hack/ci/06-delete-shoot-for-seed.sh
