name: go:test

on:
  pull_request:
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Populate module cache
      run: go mod download
    - name: Lint
      # renovate: datasource=go depName=github.com/golangci/golangci-lint/v2
      run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./cmd/... ./pkg/...
    - name: Verify generated files are up to date
      run: |
        # check-generate.sh creates a temporary checkpoint commit, which needs a git identity
        git config --global user.email "ci@opendefensecloud.org"
        git config --global user.name "opendefensecloud CI"
        make check-generate
    - name: Vulnerability scan
      # renovate: datasource=go depName=golang.org/x/vuln
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
    - name: Execute build
      run: make install
    - name: Execute tests
      run: make test-cov
