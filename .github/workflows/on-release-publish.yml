name: go:release

on:
  push:
    tags: 'v*'
  workflow_dispatch:

# Deny by default; each job opts in to exactly what it needs.
permissions: {}

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
    - name: Checkout commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Update VERSION file
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |-
          printf '%s' "$REF_NAME" > VERSION
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Create controller-registration.yaml
      run: |-
        # Populate the module cache before make: the Makefile resolves
        # GARDENER_HACK_DIR and GARDENER_TOOL_DIR via `go list -m -f {{.Dir}}`
        # at parse time, which returns empty for modules that are not extracted.
        go mod download

        make generate
    - name: Create Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        body: |-
          # [gardener-extension-provider-hcloud] ${{ github.ref_name }}
        files: |-
            example/controller-registration.yaml
  go-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
        - name: gardener-extension-provider-hcloud
        - name: gardener-extension-admission-hcloud

    steps:
    - name: Checkout commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Update VERSION file
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |-
          printf '%s' "$REF_NAME" > VERSION
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        target: ${{ matrix.name }}
        platforms: linux/amd64,linux/arm64
        push: true
        # Without this the Dockerfile's `ARG EFFECTIVE_VERSION` is empty and
        # `make install EFFECTIVE_VERSION=` stamps a blank version into the binary.
        build-args: |
          EFFECTIVE_VERSION=${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: |
          ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
          ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.ref_name }}
